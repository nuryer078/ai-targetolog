# Render Blueprint — деплой FastAPI-бэкенда витрины в один заход.
# Render читает ЭТОТ файл и собирает ровно Dockerfile.api (без угадывания папок).
# Как деплоить: render.com -> New -> Blueprint -> выбрать репозиторий -> Apply.
services:
  - type: web
    name: ai-targetolog-api
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free                 # бесплатно (спит при простое, будится ~50с)
    healthCheckPath: /health   # /health всегда открыт (без токена)
    envVars:
      # Значения-плейсхолдеры — безопасные. Секреты (sync:false) вводишь в дашборде Render.
      - key: DRY_RUN
        value: "true"          # бюджет не тратится
      - key: MAX_DAILY_BUDGET
        value: "10"
      - key: TARGET_CPL
        value: "5"
      - key: CURRENCY
        value: "USD"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: API_TOKEN
        sync: false            # тот же, что NEXT_PUBLIC_API_TOKEN на Vercel (можно не задавать)
      # Meta/Telegram/Pixel/DATABASE_URL — добавишь позже при необходимости:
      # - key: META_ACCESS_TOKEN
      #   sync: false
